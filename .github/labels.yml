# Kind and state
- name: "bug"
  color: "d73a4a"
  description: "Something doesn't work as it should"
- name: "crash"
  color: "8b0000"
  description: "Yab quit or froze"
- name: "proposal"
  color: "a2eeef"
  description: "A new feature or a change to how Yab works; the owner decides"
- name: "needs triage"
  color: "ededed"
  description: "Not yet read by a maintainer"
- name: "needs info"
  color: "fef2c0"
  description: "Waiting on the reporter: version, steps or a recording"
- name: "needs design"
  color: "f9d0c4"
  description: "Changes what people see; waits for a maintainer's pick from pictures"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported; see the linked issue"
- name: "good first issue"
  color: "7057ff"
  description: "Small, well-understood, a good start"
- name: "help wanted"
  color: "008672"
  description: "Ready for anyone to pick up"
- name: "engine: webkit"
  color: "0e8a16"
  description: "Only on WebKit tabs"
- name: "engine: chromium"
  color: "1d76db"
  description: "Only on Chromium tabs"
- name: "needs patched cef"
  color: "5319e7"
  description: "Only reproduces on the release CEF build, not stock CEF; a maintainer checks it"
- name: "fixed in release"
  color: "0e8a16"
  description: "The fix shipped; the version is in the closing comment"
- name: "agent: fixing"
  color: "bfdadc"
  description: "A maintainer's coding agent is working on a fix"
- name: "ready for review"
  color: "0075ca"
  description: "Proof attached; waiting for a maintainer"
- name: "arc-divergent"
  color: "e4e669"
  description: "Asks Yab to behave unlike Arc; reopens at 10 votes or reports, then ships as an option"
