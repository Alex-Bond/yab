# Labels for the public repository. Synced by .github/workflows/labels.yml
# on every push to main that changes this file. Area labels match the
# request register's themes; severities match its four levels.

# Severity
- name: "Blocker"
  color: "b60205"
  description: "Yab can't be used, data is lost, or a crash on launch. Fixed before anything else."
- name: "Broken"
  color: "d93f0b"
  description: "A feature doesn't work, with no reasonable way around it."
- name: "Annoying"
  color: "fbca04"
  description: "Works, but gets in the way, or there is a workaround."
- name: "Polish"
  color: "c5def5"
  description: "Small visual or wording detail."

