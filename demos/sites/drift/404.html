<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Drift</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/assets/app.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; text-align: center; }
  .lost { display: grid; justify-items: center; padding: 32px var(--gutter); }
  .lost img { width: 64px; height: 64px; margin-bottom: 24px; }
  .lost h1 { font: 800 32px/40px var(--font-display); letter-spacing: -0.03em; margin-bottom: 8px; }
  .lost p { color: var(--text-2); font-size: 16px; line-height: 24px; margin-bottom: 24px; }
  .lost a { display: inline-flex; align-items: center; height: 40px; padding: 0 24px; border-radius: var(--r-pill); background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .lost a:hover { background: var(--accent-2); }
</style>
</head>
<body>
  <main class="lost">
    <img src="/favicon.svg" alt="" width="64" height="64">
    <h1>This page drifted off</h1>
    <p>It isn't here anymore, or it never was.</p>
    <a href="/">Back to Drift</a>
  </main>
</body>
</html>
