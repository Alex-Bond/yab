<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expenses · Ledger</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/assets/ledger.css">
</head>
<body data-page="expenses">
<script src="/assets/shell.js"></script>
<main>
  <div class="page">
    <div class="head">
      <div><h1>Expenses</h1><p>Team card and out-of-pocket spend at Tern Labs, with the receipts behind it.</p></div>
      <div class="actions">
        <a class="btn" href="/reports/expenses.csv"><span data-icon="download" data-size="16"></span>Export</a>
        <a class="btn primary" href="/expenses/new"><span data-icon="plus" data-size="16"></span>New expense</a>
      </div>
    </div>
    <div class="grid stats" id="stats"></div>
    <div class="tabs" id="tabs"></div>
    <section class="card table-card">
      <div class="table-wrap">
        <table class="t" id="table">
          <thead><tr><th>Merchant</th><th>Category</th><th>Date</th><th>Spent by</th><th>Receipt</th><th>Status</th><th class="r">Amount</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="t-foot"><span id="count"></span><span class="end">Amounts in their own currency, totals in USD</span></div>
    </section>
  </div>
</main>
<script src="/assets/data.js"></script>
<script src="/assets/pages.js"></script>
</body>
</html>
