<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payments · Ledger</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/assets/ledger.css">
</head>
<body data-page="payments">
<script src="/assets/shell.js"></script>
<main>
  <div class="page">
    <div class="head">
      <div><h1>Payments</h1><p>Every charge, refund and failed attempt across Tern's customers.</p></div>
      <div class="actions">
        <a class="btn" href="/reports/payments.csv"><span data-icon="download" data-size="16"></span>Export</a>
        <button class="btn primary" type="button"><span data-icon="plus" data-size="16"></span>Create payment</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="filters">
      <label class="find"><span data-icon="search" data-size="16"></span><input id="find" type="text" placeholder="Filter by customer, email or description" aria-label="Filter payments"></label>
      <button class="chip" type="button"><span data-icon="plus" data-size="16"></span>Date</button>
      <button class="chip" type="button"><span data-icon="plus" data-size="16"></span>Amount</button>
      <button class="chip" type="button"><span data-icon="plus" data-size="16"></span>Payment method</button>
      <span class="grow"></span>
      <button class="btn ghost" type="button"><span data-icon="filter" data-size="16"></span>Columns</button>
    </div>
    <section class="card table-card">
      <div class="table-wrap">
        <table class="t" id="table">
          <thead><tr><th class="r">Amount</th><th>Status</th><th>Customer</th><th>Description</th><th class="hide-md">Payment method</th><th>Date</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="t-foot"><span id="count"></span><div class="pager"><button class="btn" type="button" disabled>Previous</button><button class="btn" type="button">Next</button></div></div>
    </section>
  </div>
</main>
<script src="/assets/data.js"></script>
<script src="/assets/pages.js"></script>
</body>
</html>
