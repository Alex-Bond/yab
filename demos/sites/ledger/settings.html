<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Ledger</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/assets/ledger.css">
</head>
<body data-page="settings">
<script src="/assets/shell.js"></script>
<main>
  <div class="page">
    <div class="head">
      <div><h1>Settings</h1><p>Tern Labs AB's account, team and payouts.</p></div>
    </div>
    <div class="grid row-pair flush">
      <section class="card">
        <div class="card-head"><h3>Business</h3><button class="btn end" type="button">Edit</button></div>
        <div class="card-body list-body"><div class="list" id="business"></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h3>Payouts</h3><button class="btn end" type="button">Change</button></div>
        <div class="card-body list-body"><div class="list" id="payout-settings"></div></div>
      </section>
    </div>
    <h2 class="section">Team <a href="#invite">Invite teammate</a></h2>
    <section class="card table-card">
      <div class="table-wrap">
        <table class="t" id="team">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Access</th><th>Last active</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<script src="/assets/data.js"></script>
<script src="/assets/pages.js"></script>
</body>
</html>
