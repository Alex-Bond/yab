<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook</title>
<meta name="description" content="Daybook: your week, your next meeting, one click to join.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/assets/daybook.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Sidebar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="dbg" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#FF7657"/><stop offset="1" stop-color="#E23B2E"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#dbg)"/><rect x="7" y="8.6" width="18" height="16.4" rx="3.4" fill="#fff"/><rect x="7" y="8.6" width="18" height="4.6" rx="2.3" fill="#FFE3DC"/><rect x="7" y="11" width="18" height="2.2" fill="#FFE3DC"/><rect x="11" y="6.2" width="2.4" height="5" rx="1.2" fill="#fff"/><rect x="18.6" y="6.2" width="2.4" height="5" rx="1.2" fill="#fff"/><circle cx="19.6" cy="19.2" r="2.9" fill="#EC4A35"/></svg>
      <b>Daybook</b>
      <span class="sp"></span>
      <button class="icon-btn" type="button" id="find" title="Search events" aria-label="Search events" data-icon="search"></button>
    </div>

    <section class="next" id="next" hidden aria-live="polite">
      <div class="lab"><span class="pulse"></span><span>Up next</span><span>·</span><span class="when" id="next-when"></span></div>
      <h3 id="next-title"></h3>
      <div class="meta" id="next-meta"></div>
      <div class="row">
        <div class="faces" id="next-faces"></div>
        <span class="sp"></span>
        <a class="join" id="next-join" href="#" target="_blank" rel="noopener"><span data-icon="video"></span>Join</a>
      </div>
    </section>

    <section class="mini" id="mini" aria-label="Month"></section>

    <section class="cals" id="cals" aria-label="Calendars"></section>

    <div class="side-foot">
      <div class="who"><span class="avatar">ML</span><div><b id="me-name">Mira Lindqvist</b><span id="me-mail">mira@ternlabs.com</span></div></div>
      <button class="icon-btn" type="button" title="Settings" aria-label="Settings" data-icon="settings"></button>
    </div>
  </aside>

  <main class="cal" id="cal">
    <header class="bar">
      <button class="btn" type="button" id="go-today" title="Today (T)">Today</button>
      <div class="arrows">
        <button class="icon-btn" type="button" id="go-prev" title="Previous (←)" aria-label="Previous" data-icon="left"></button>
        <button class="icon-btn" type="button" id="go-next" title="Next (→)" aria-label="Next" data-icon="right"></button>
      </div>
      <h1 id="title">September <span>2026</span></h1>
      <span class="badge" id="weekno">W40</span>
      <span class="sp"></span>
      <span class="tz" id="tz"></span>
      <div class="seg" id="views" role="tablist">
        <button type="button" data-v="day" role="tab">Day</button>
        <button type="button" data-v="week" class="on" role="tab">Week</button>
      </div>
      <span class="avatar" title="Mira Lindqvist">ML</span>
    </header>
    <div class="scroll" id="scroll">
      <div class="head">
        <div class="dayrow" id="dayrow"></div>
        <div class="allday" id="allday"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="pop" id="pop" role="dialog" aria-label="Event"></div>
  </main>
</div>
<script src="/assets/daybook.js"></script>
</body>
</html>
