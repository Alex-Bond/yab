<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/base.css">
<title>Page not found · Orbit</title>
<style>
  body { display: grid; place-items: center; min-height: 100vh; background: var(--surface-2); }
  main { text-align: center; padding: var(--s-6); }
  .code { color: var(--brand); font: var(--fw-semibold) var(--fs-caption)/var(--lh-caption) var(--mono); letter-spacing: .08em; }
  h1 { margin: var(--s-2) 0; font-size: var(--fs-heading); line-height: var(--lh-heading); font-weight: var(--fw-semibold); letter-spacing: var(--tracking-tight); }
  p { max-width: 360px; margin: 0 auto var(--s-6); color: var(--text-2); font-size: var(--fs-lead); line-height: var(--lh-lead); }
  .row { display: flex; gap: var(--s-2); justify-content: center; }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>This page drifted out of orbit</h1>
  <p>The link may be old, or the page was moved. Your dashboards are still where you left them.</p>
  <div class="row"><a class="btn btn-primary" href="/">Go to your dashboard</a><a class="btn btn-secondary" href="/login">Sign in</a></div>
</main>
</body>
</html>
